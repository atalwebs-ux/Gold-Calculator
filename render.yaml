services:
  - type: web
    name: global-gold-live-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: FASTFOREX_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
